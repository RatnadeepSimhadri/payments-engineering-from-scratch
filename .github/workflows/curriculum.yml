name: curriculum

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Lesson invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/audit_lessons.py
      - run: python3 scripts/sync_skills.py --check
      - run: python3 scripts/build_catalog.py --check

  lessons:
    name: Run every lesson (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [java, python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        if: matrix.lang == 'java'
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with: { go-version: "1.22" }
      - run: python3 scripts/run_lesson.py --all --lang ${{ matrix.lang }}

  projects:
    name: Grade project reference solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: |
          for p in $(python3 scripts/project_test.py --list | awk '{print $1}'); do
            python3 scripts/project_test.py "$p" --lang java --all --solution --strict
          done

  catalog-sync:
    name: Regenerate README/ROADMAP on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [audit]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_catalog.py
      - run: |
          git config user.name "curriculum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md ROADMAP.md phases/*/README.md
          git diff --cached --quiet || git commit -m "chore: sync README, ROADMAP, and phase READMEs"
          git push
