name: site

# Builds the learner-facing static site with scripts/build_site.py and deploys it to GitHub Pages.
# Pages must be enabled once in the repository settings with source "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/build_site.py"
      - "scripts/_lib.py"
      - "site-src/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_catalog.py && python3 scripts/build_site.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
